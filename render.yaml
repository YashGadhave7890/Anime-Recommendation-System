# =============================================================================
# Render Blueprint Specification for ANIMORA Backend Service
# =============================================================================

services:
  - type: web
    name: animora-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: animora-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/animora.db
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
